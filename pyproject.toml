[project]
name = "mpv"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", "W", # pycodestyle
    "N", # pep8-naming
    "UP", # pyupgrade
    "A", # flake8-builtins
    "Q", # flake8-quotes
    "COM", # flake8-commas
]
